<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <script>/* thème clair mémorisé : appliqué avant tout affichage (pas de flash) */(function(){try{if(localStorage.getItem("abouv:theme")==="light"){var r=document.documentElement;r.setAttribute("data-theme","light");r.style.background="#efebe3";}}catch(e){}})();</script>
  <link rel="expect" href="#i18n-end" blocking="render" />
  <!-- GitHub Pages sert cette page pour n'importe quelle adresse introuvable, à n'importe quelle profondeur
       (ex. …/oeuvres/une-oeuvre-disparue.html) : on ancre les chemins relatifs à la racine du site
       (le dossier /abouv/ sur etingaa.github.io, sinon la racine du domaine ; avec la langue : /en/…) -->
  <script>(function(){var m=location.pathname.match(/^(\/abouv)?\/((fr|en|es|it)\/)?/),b=document.createElement("base");b.href=m[0]||"/";document.head.appendChild(b);})();</script>
  <style>html{background:#060b18}</style>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />

  <!-- pages préchargées au survol d'un lien : changement de page quasi instantané (la galerie 3D est seulement préchargée) -->
  <script type="speculationrules">
    {"prerender":[{"where":{"and":[{"selector_matches":".nav__link, .bottom__link--legal"},{"not":{"selector_matches":"[href='./'], [href='../']"}}]},"eagerness":"conservative"}],
     "prefetch":[{"where":{"selector_matches":".nav__link, .bottom__link--legal"},"eagerness":"moderate"}]}
  </script>

  <link rel="stylesheet" href="styles.css?v=20261030a" />

    .notFound .actions{ display:flex; flex-wrap:wrap; gap:8px; }
    .notFound a.back{
      display:inline-flex; align-items:center; height:var(--control-h); padding:0 14px;
      border:1px solid var(--line); border-radius:var(--radius); background:var(--fill);
      font-size:14px; font-weight:600; transition:background-color var(--ease);
    }
    .notFound a.back:hover{ background:var(--fill-hover); }
  </style>
</head>
