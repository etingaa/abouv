<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Expositions personnelles, collectives et salons d'Annick Bouvattier depuis 1992." />
  <meta name="theme-color" content="#02253A" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Annick Bouvattier" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:title" content="Expositions — Annick Bouvattier" />
  <meta property="og:description" content="Expositions personnelles, collectives et salons d'Annick Bouvattier depuis 1992." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <title>Expositions — Annick Bouvattier</title>

  <style>
    :root{
      --bg:#02253A;
      --ink:#fff;
      --soft:rgba(255,255,255,.82);
      --faint:rgba(255,255,255,.55);
      --border:rgba(255,255,255,.18);
      --chip:rgba(255,255,255,.08);
      --chip2:rgba(255,255,255,.12);
    }
    /* Page head */
    .headRow{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:18px 0 10px}
    h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
    .meta{color:var(--faint);font-size:14px}

    /* "En ce moment" */
    .now{
      border:1px solid var(--border);
      border-radius:18px;
      overflow:hidden;
      background:rgba(255,255,255,.04);
      display:grid;
      grid-template-columns: 1.2fr 1fr;
      min-height: 220px;
    }
    @media (max-width:900px){.now{grid-template-columns:1fr}}
    .now__img{
      background:
        radial-gradient(900px 520px at 30% 20%, rgba(255,255,255,.20), rgba(255,255,255,0) 60%),
        linear-gradient(120deg, rgba(255,255,255,.10), rgba(255,255,255,.02));
      min-height:220px;
    }
    .now__body{padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
    .kicker{font-size:12px;letter-spacing:.10em;text-transform:uppercase;color:var(--faint)}
    .now__title{margin:0;font-size:18px;font-weight:800}
    .now__line{color:var(--soft);line-height:1.55}
    .btn{
      width:max-content;
      border:1px solid var(--border);
      background:rgba(255,255,255,.14);
      color:var(--ink);
      font-weight:700;
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
    }
    .btn:hover{background:rgba(255,255,255,.18)}

    /* Filters */
    .filters{
      margin-top:14px;
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px;
      background:rgba(255,255,255,.04);
      display:grid;
      grid-template-columns: 1.2fr 1fr 1fr 1fr auto;
      gap:10px;
      align-items:end;
    }
    @media (max-width:1050px){.filters{grid-template-columns:1fr 1fr 1fr}}
    @media (max-width:680px){.filters{grid-template-columns:1fr}}

    .field{display:flex;flex-direction:column;gap:6px;min-width:0}
    .label{font-size:12px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
    input,select{
      color-scheme:dark; /* listes déroulantes sombres (sinon texte blanc sur fond blanc sous Windows) */
      height:44px;width:100%;
      border:1px solid var(--border);
      background:rgba(255,255,255,.08);
      color:var(--ink);
      border-radius:12px;
      padding:10px 12px;
      outline:none;
      font-size:14px;
    }
    input::placeholder{color:rgba(255,255,255,.45)}
    input:focus,select:focus{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.12)}

    /* Timeline */
    .timeline{margin-top:18px;display:flex;flex-direction:column;gap:18px}
    .yearBlock{
      border:1px solid var(--border);
      border-radius:18px;
      background:rgba(255,255,255,.04);
      overflow:hidden;
    }
    .yearHead{
      display:flex;justify-content:space-between;align-items:baseline;
      padding:14px 16px;
      border-bottom:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.02);
    }
    .year{font-size:18px;font-weight:800}
    .yearCount{color:var(--faint);font-size:14px}

    .items{
      padding:10px 12px 12px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    @media (max-width:900px){.items{grid-template-columns:1fr}}

    /* ✅ NOUVEAU : si une seule expo, on fait une colonne */
    .items.is-single{
      grid-template-columns: 1fr;
    }

    /* (optionnel mais joli) : si tu veux éviter que la carte s'étire trop */
    .items.is-single .expo{
      max-width: 920px;
      justify-self: start; /* mets center si tu préfères centré */
    }

    .expo{
      border:1px solid rgba(255,255,255,.14);
      border-radius:16px;
      padding:12px 12px 11px;
      background:rgba(255,255,255,.03);
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .expo:hover{border-color:rgba(255,255,255,.26);background:rgba(255,255,255,.05)}
    .expoTitle{margin:0;font-weight:800;font-size:14px;letter-spacing:.02em}
    .expoMeta{margin:0;color:var(--soft);font-size:13px;line-height:1.5}
    .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
    .tag{
      font-size:12px;padding:6px 8px;border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      color:var(--soft);
    }

    .empty{margin-top:14px;color:var(--faint)}
  </style>
</head>

<body>
  <div class="container">
    <header class="top">
      <a class="brand" href="index.html">ANNICK&nbsp;BOUVATTIER</a>
      <nav class="top__nav" aria-label="Navigation principale">
        <a class="nav__link" href="index.html">Accueil</a>
        <a class="nav__link" href="portfolio.html">Portfolio</a>
        <a class="nav__link" href="galeries.html">Galeries</a>
        <a class="nav__link is-active" aria-current="page" href="expositions.html">Expositions</a>
        <a class="nav__link" href="apropos.html">À propos</a>
        <a class="nav__link" href="presse.html">Presse</a>
        <a class="nav__link" href="contact.html">Contact</a>
      </nav>
    </header>

    <div class="headRow">
      <h1>Expositions</h1>
      <div class="meta" id="meta"></div>
    </div>

    <!-- En ce moment (optionnel) -->
    <section class="now" id="now" hidden>
      <div class="now__img" aria-hidden="true"></div>
      <div class="now__body">
        <div class="kicker">En ce moment</div>
        <h2 class="now__title" id="nowTitle"></h2>
        <div class="now__line" id="nowLine"></div>
        <a class="btn" id="nowBtn" href="#" target="_blank" rel="noopener noreferrer">Voir les infos</a>
      </div>
    </section>

    <!-- Filtres -->
    <section class="filters" aria-label="Filtres">
      <div class="field">
        <label class="label" for="q">Rechercher</label>
        <input id="q" type="search" placeholder="Galerie, ville, pays…" />
      </div>
      <div class="field">
        <label class="label" for="type">Type</label>
        <select id="type">
          <option value="all">Tous</option>
          <option value="solo">Personnelle</option>
          <option value="group">Collective</option>
          <option value="salon">Salon / Art fair</option>
        </select>
      </div>
      <div class="field">
        <label class="label" for="country">Pays</label>
        <select id="country">
          <option value="all">Tous</option>
        </select>
      </div>
      <div class="field">
        <label class="label" for="year">Année</label>
        <select id="year">
          <option value="all">Toutes</option>
        </select>
      </div>
      <button class="btn" id="reset" type="button">Réinitialiser</button>
    </section>

    <section class="timeline" id="timeline"></section>
    <p class="empty" id="empty" hidden>Aucune exposition ne correspond aux filtres.</p>
    <footer class="siteFooter">
      <div class="siteFooter__social">
        <a href="https://www.instagram.com/annick.bouvattier/" target="_blank" rel="noopener noreferrer">instagram</a>
        <a href="https://www.facebook.com/annick.bouvattier/" target="_blank" rel="noopener noreferrer">facebook</a>
        <a href="https://www.saatchiart.com/bouvattier" target="_blank" rel="noopener noreferrer">saatchi art</a>
      </div>
      <a class="siteFooter__legal" href="mentions-legales.html">mentions légales</a>
    </footer>
  </div>

  <script>
    const expos = [
      { year: 2019, title: "Galerie Bouillon d’Art", city: "Bordeaux", country: "France", type: "solo" },
      { year: 2018, title: "Artclub Gallery", city: "Paris", country: "France", type: "solo" },
      { year: 2015, title: "Galerie Next", city: "Toulouse", country: "France", type: "solo" },
      { year: 2013, title: "Galerie Salvany", city: "Clermont-Ferrand", country: "France", type: "solo" },
      { year: 2012, title: "Artclub Gallery", city: "Paris", country: "France", type: "solo" },
      { year: 2011, title: "Palm Beach", city: "Cannes", country: "France", type: "solo" },
      { year: 2011, title: "Galerie Neel", city: "Cannes", country: "France", type: "solo" },
      { year: 2010, title: "Galerie des Chapelains", city: "Nevers", country: "France", type: "solo" },
      { year: 2009, title: "Artclub Gallery", city: "Paris", country: "France", type: "solo" },
      { year: 2006, title: "Galerie Salvany", city: "Clermont-Ferrand", country: "France", type: "solo" },
      { year: 2005, title: "Artclub Gallery", city: "Paris", country: "France", type: "solo" },
      { year: 2005, title: "Galerie Futurart", city: "Bruxelles", country: "Belgique", type: "solo" },
      { year: 2002, title: "Galerie Aktuaryus", city: "Strasbourg", country: "France", type: "solo" },
      { year: 2002, title: "Galerie des Chapelains", city: "Nevers", country: "France", type: "solo" },
      { year: 2001, title: "Galerie Tosaka", city: "Paris", country: "France", type: "solo" },
      { year: 2000, title: "Galerie Aktuaryus", city: "Strasbourg", country: "France", type: "solo" },
      { year: 2000, title: "Galerie des Chapelains", city: "Nevers", country: "France", type: "solo" },
      { year: 1997, title: "Galerie Saint-Cyr", city: "Nevers", country: "France", type: "solo" },
      { year: 1996, title: "Galerie Étienne De Caussans", city: "Paris", country: "France", type: "solo" },
      { year: 1993, title: "Galerie Jason", city: "Perpignan", country: "France", type: "solo" },

      { year: 2024, title: "French Art Network — Galerie Rue Toulouse", city: "Laguna Beach, Carmel", country: "États-Unis", type: "group" },
      { year: 2024, title: "Galerie Page", city: "Biarritz", country: "France", type: "group" },
      { year: 2018, title: "Galerie ArtAddict", city: "Mougins", country: "France", type: "group" },
      { year: 2018, title: "Art3F", city: "Cannes", country: "France", type: "salon" },
      { year: 2017, title: "ArtShopping", city: "Paris", country: "France", type: "salon" },
      { year: 2017, title: "ArtFair", city: "Lausanne", country: "Suisse", type: "salon" },
      { year: 2017, title: "Art3F", city: "Paris", country: "France", type: "salon" },
      { year: 2016, title: "Exposition ArtFair", city: "Anvers", country: "Belgique", type: "salon" },
      { year: 2010, title: "Galerie Neel", city: "Cannes", country: "France", type: "group" },
      { year: 2008, title: "Galerie Joël Dupuis", city: "Hardelot-sur-Mer", country: "France", type: "group" },
      { year: 2007, title: "The Catto Gallery", city: "Londres", country: "Angleterre", type: "group" },
      { year: 2007, title: "Galerie Joël Dupuis", city: "Hardelot-sur-Mer", country: "France", type: "group" },
      { year: 2007, title: "Galerie Hugues Penot", city: "La Baule", country: "France", type: "group" },
      { year: 1998, title: "Artexpo", city: "New York", country: "États-Unis", type: "salon" },
      { year: 1998, title: "Galerie Christian Dazy", city: "Dijon", country: "France", type: "group" },
      { year: 1997, title: "Musée de Marzy", city: "Marzy", country: "France", type: "group" },
      { year: 1996, title: "Salon de Printemps", city: "Decize", country: "France", type: "salon" },
      { year: 1994, title: "Salon de Bourges", city: "Bourges", country: "France", type: "salon" },
      { year: 1993, title: "Salon d’Automne (Grand Palais)", city: "Paris", country: "France", type: "salon" },
      { year: 1992, title: "Exposition d’Été", city: "Decize", country: "France", type: "group" }
    ];

    // Optionnel : "en ce moment"
    const nowExpo = null;

    const els = {
      meta: document.getElementById("meta"),
      now: document.getElementById("now"),
      nowTitle: document.getElementById("nowTitle"),
      nowLine: document.getElementById("nowLine"),
      nowBtn: document.getElementById("nowBtn"),
      q: document.getElementById("q"),
      type: document.getElementById("type"),
      country: document.getElementById("country"),
      year: document.getElementById("year"),
      reset: document.getElementById("reset"),
      timeline: document.getElementById("timeline"),
      empty: document.getElementById("empty"),
    };

    function uniq(arr){ return [...new Set(arr)].sort((a,b)=> (""+a).localeCompare(""+b)); }

    function hydrate(){
      els.meta.textContent = `${expos.length} expositions`;

      if(nowExpo){
        els.now.hidden = false;
        els.nowTitle.textContent = nowExpo.title;
        els.nowLine.textContent = nowExpo.line;
        els.nowBtn.href = nowExpo.url;
      }

      uniq(expos.map(e=>e.country)).forEach(c=>{
        const o=document.createElement("option");
        o.value=c; o.textContent=c;
        els.country.appendChild(o);
      });

      const years = uniq(expos.map(e=>e.year)).sort((a,b)=>b-a);
      years.forEach(y=>{
        const o=document.createElement("option");
        o.value=String(y); o.textContent=String(y);
        els.year.appendChild(o);
      });
    }

    function matches(e, f){
      const q = f.q.trim().toLowerCase();
      const hay = `${e.title} ${e.city} ${e.country} ${e.year} ${e.note||""}`.toLowerCase();
      if(q && !hay.includes(q)) return false;
      if(f.type !== "all" && e.type !== f.type) return false;
      if(f.country !== "all" && e.country !== f.country) return false;
      if(f.year !== "all" && String(e.year) !== f.year) return false;
      return true;
    }

    function groupByYear(list){
      const m = new Map();
      list.forEach(e=>{
        const y = e.year;
        if(!m.has(y)) m.set(y, []);
        m.get(y).push(e);
      });
      return [...m.entries()].sort((a,b)=> b[0]-a[0]);
    }

    function typeLabel(t){
      if(t==="solo") return "Personnelle";
      if(t==="group") return "Collective";
      if(t==="salon") return "Salon / Art fair";
      return "";
    }

    function render(){
      const f = {
        q: els.q.value || "",
        type: els.type.value,
        country: els.country.value,
        year: els.year.value,
      };

      const filtered = expos.filter(e=>matches(e,f));
      els.timeline.innerHTML = "";
      els.empty.hidden = filtered.length !== 0;

      const blocks = groupByYear(filtered);

      blocks.forEach(([year, items])=>{
        const block = document.createElement("article");
        block.className = "yearBlock";
        block.innerHTML = `
          <header class="yearHead">
            <div class="year">${year}</div>
            <div class="yearCount">${items.length} exposition${items.length>1?"s":""}</div>
          </header>
          <div class="items"></div>
        `;
        const wrap = block.querySelector(".items");

        /* ✅ NOUVEAU : si une seule carte, on force 1 colonne */
        if(items.length === 1) wrap.classList.add("is-single");

        items.forEach(e=>{
          const card = document.createElement("div");
          card.className = "expo";
          card.innerHTML = `
            <p class="expoTitle">${escapeHtml(e.title)}</p>
            <p class="expoMeta">${escapeHtml(e.city)} · ${escapeHtml(e.country)}${e.note ? " · " + escapeHtml(e.note) : ""}</p>
            <div class="tags">
              <span class="tag">${typeLabel(e.type)}</span>
            </div>
          `;
          wrap.appendChild(card);
        });

        els.timeline.appendChild(block);
      });
    }

    function escapeHtml(s){
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    els.q.addEventListener("input", render);
    [els.type, els.country, els.year].forEach(sel => sel.addEventListener("change", render));

    els.reset.addEventListener("click", ()=>{
      els.q.value="";
      els.type.value="all";
      els.country.value="all";
      els.year.value="all";
      render();
    });

    hydrate();
    render();
  </script>
</body>
</html>
