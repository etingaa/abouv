      <h1 class="sr-only">Galeries</h1>
      <!-- Filtres : même barre que le portfolio et les expositions -->
      <section class="toolbar" aria-label="Filtres">
        <div class="toolbar__row">
          <div class="tabs" id="groups" aria-label="Filtrer par">
            <div class="group" data-group="country"><button class="tab tab--group" type="button" data-group="country" aria-expanded="false" aria-controls="subtabs"><span class="tab__name">Pays</span><span class="tab__value" translate="no"></span><svg class="tab__caret" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg></button><button class="group__clear" type="button" aria-label="Retirer ce filtre" title="Retirer ce filtre" hidden><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6"/></svg></button></div>
            <div class="group" data-group="city"><button class="tab tab--group" type="button" data-group="city" aria-expanded="false" aria-controls="subtabs"><span class="tab__name">Ville</span><span class="tab__value" translate="no"></span><svg class="tab__caret" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg></button><button class="group__clear" type="button" aria-label="Retirer ce filtre" title="Retirer ce filtre" hidden><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6"/></svg></button></div>
          </div>
          <label class="search">
            <svg class="search__icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
            <input id="q" type="search" placeholder="Rechercher" aria-label="Rechercher une galerie" />
            <span class="sr-only" id="count" aria-live="polite"></span>
          </label>
        </div>
        <div class="subtabs" id="subtabs" translate="no" hidden></div>
      </section>

      <!-- Carte + liste, reliées : survoler l'une met l'autre en évidence -->
      <div class="galCard">
        <section class="galMap" aria-label="Carte des galeries">
          <div id="map" class="darkMap"></div>
        </section>
        <aside class="galSide" aria-label="Liste des galeries">
          <div class="galList" id="list" translate="no"></div>
        </aside>
      </div>

    <footer class="bottom">
