<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Contacter Annick Bouvattier : renseignement sur une œuvre, une exposition ou une commande." />
  <meta name="theme-color" content="#02253A" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Annick Bouvattier" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:title" content="Contact — Annick Bouvattier" />
  <meta property="og:description" content="Contacter Annick Bouvattier : renseignement sur une œuvre, une exposition ou une commande." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <script src="i18n.js"></script>
  <script src="site.js"></script>
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <title>Contact — Annick Bouvattier</title>


  <style>
    :root{
      --bg:#02253A;
      --ink:#fff;
      --soft:rgba(255,255,255,.82);
      --faint:rgba(255,255,255,.55);
      --border:rgba(255,255,255,.18);
      --chip:rgba(255,255,255,.08);
      --chip2:rgba(255,255,255,.12);
    }
    /* Page head */
    .headRow{
      display:flex;align-items:baseline;justify-content:space-between;
      gap:16px;margin:18px 0 14px;
    }
    h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
    .lead{margin:10px 0 0;color:var(--soft);max-width:760px;line-height:1.6}

    /* Card */
    .card{
      margin-top:14px;
      border:1px solid var(--border);
      border-radius:18px;
      background:rgba(255,255,255,.04);
      padding: 24px;
      max-width: 560px;   /* le formulaire remplit le cadre, aligné sous le titre */
    }

    /* Formspree form styling (simple) */
    form{margin:0;display:grid;gap:12px}
    label{display:grid;gap:6px;color:var(--faint);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
    input, textarea{
      width:100%;
      border:1px solid var(--border);
      background:var(--chip);
      color:var(--ink);
      border-radius:12px;
      padding:12px 12px;
      outline:none;
      font-size:14px;
      text-transform:none;
      letter-spacing:normal;
      font-weight:500;
    }
    input{height:44px}
    textarea{min-height:160px;resize:vertical}
    input::placeholder, textarea::placeholder{color:rgba(255,255,255,.45)}
    input:focus, textarea:focus{
      border-color:rgba(255,255,255,.35);
      background:var(--chip2);
    }
    /* Bouton principal : plein, pour se distinguer des champs */
    button{
      height:44px;
      padding:0 24px;
      border-radius:12px;
      border:1px solid #fff;
      background:#fff;
      color:var(--bg);
      font-weight:800;
      cursor:pointer;
      width: fit-content;
      transition: background .15s ease, border-color .15s ease;
    }
    button:hover{background:rgba(255,255,255,.85);border-color:rgba(255,255,255,.85)}

    .formNote{margin:0;font-size:12px;line-height:1.5;color:var(--faint)}
    .formNote a{border-bottom:1px solid rgba(255,255,255,.35)}
    .formStatus{margin:0;line-height:1.5;color:var(--soft)}
    .formStatus.is-error{color:#ff9b9b}
    button:disabled{opacity:.6;cursor:progress}
  </style>
</head>

<body>
  <div class="container">
    <header class="top">
      <a class="brand" href="index.html">ANNICK&nbsp;BOUVATTIER</a>
      <nav class="top__nav" aria-label="Navigation principale">
        <a class="nav__link" href="index.html">Accueil</a>
        <a class="nav__link" href="portfolio.html">Portfolio</a>
        <a class="nav__link" href="galeries.html">Galeries</a>
        <a class="nav__link" href="expositions.html">Expositions</a>
        <a class="nav__link" href="apropos.html">À propos</a>
        <a class="nav__link" href="presse.html">Presse</a>
        <a class="nav__link is-active" aria-current="page" href="contact.html">Contact</a>
      </nav>
    </header>

    <div class="headRow">
      <div>
        <h1>Contact</h1>
        <p class="lead">Écrivez-moi ici, je vous réponds dès que possible.</p>
      </div>
    </div>

    <section class="card" aria-label="Formulaire de contact">
      <form id="contactForm" action="https://formspree.io/f/xdalokdl" method="POST">
        <label>
          Email
          <input type="email" name="email" autocomplete="email" required>
        </label>

        <label>
          Prénom
          <input type="text" name="Prénom" autocomplete="given-name" required>
        </label>

        <label>
          Nom
          <input type="text" name="Nom" autocomplete="family-name" required>
        </label>

        <label>
          Organisation
          <input type="text" name="Organisation" autocomplete="organization">
        </label>

        <label>
          Pays
          <input type="text" name="Pays" autocomplete="country-name">
        </label>

        <label>
          Message
          <textarea name="message" id="message" required></textarea>
        </label>

        <!-- anti-spam : champ invisible, rempli uniquement par les robots (ignoré par Formspree) -->
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true"
               style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
        <input type="hidden" name="_subject" value="Nouveau message depuis le site Annick Bouvattier">
        <!-- langue du site au moment de l'envoi : pour savoir en quelle langue répondre -->
        <input type="hidden" name="Langue" id="langField" value="fr">

        <button type="submit" id="submitBtn">Envoyer</button>
        <p class="formNote">Les informations saisies servent uniquement à répondre à votre demande. <a href="mentions-legales.html">En savoir plus</a></p>
        <p id="formStatus" class="formStatus" role="status" aria-live="polite" hidden></p>
      </form>
    </section>
    <footer class="bottom">
        <div class="bottom__left">
          <a class="bottom__link" href="https://www.instagram.com/annick.bouvattier/" target="_blank" rel="noopener noreferrer">instagram</a>
          <a class="bottom__link" href="https://www.facebook.com/annick.bouvattier/" target="_blank" rel="noopener noreferrer">facebook</a>
          <a class="bottom__link" href="https://www.saatchiart.com/bouvattier" target="_blank" rel="noopener noreferrer">saatchi art</a>
        </div>
        <a class="bottom__link bottom__link--legal" href="mentions-legales.html">mentions légales</a>
      </footer>
  </div>

  <script>
  (() => {
    const form = document.getElementById("contactForm");
    const status = document.getElementById("formStatus");
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("message");
    document.getElementById("langField").value = I18N.lang === "en" ? "anglais" : "français";

    // Arrivée depuis « Demander des informations » sur le portfolio : message pré-rempli
    const oeuvre = new URLSearchParams(location.search).get("oeuvre");
    if (oeuvre && !msg.value) {
      msg.value = t("Bonjour,\n\nJe souhaiterais avoir des informations sur l'œuvre « {oeuvre} ».\n\nMerci,", { oeuvre: oeuvre.slice(0, 120) });
    }

    function say(text, isError) {
      status.textContent = text;
      status.classList.toggle("is-error", !!isError);
      status.hidden = false;
    }

    // Envoi sans quitter le site. En cas de souci (JS ou réponse inattendue), on retombe sur
    // l'envoi classique du formulaire, qui fonctionne toujours.
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      status.hidden = true;
      try {
        const res = await fetch(form.action, {
          method: "POST",
          body: new FormData(form),
          headers: { "Accept": "application/json" },
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        form.reset();
        say(t("Merci, votre message a bien été envoyé. Je vous réponds dès que possible."));
      } catch (err) {
        console.warn("Envoi AJAX impossible, envoi classique.", err);
        form.submit();
      } finally {
        btn.disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
