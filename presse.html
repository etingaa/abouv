<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Presse — Annick Bouvattier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    body.presse{ background:#02253A; }

    .headRow{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      margin:18px 0;
    }
    h1{ margin:0; font-size:28px; font-weight:800; }
    .meta{ color:rgba(255,255,255,.55); font-size:14px; }

    .presseLayout{
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      gap:32px;
      margin-top:24px;
      align-items:center;
    }
    @media (max-width:900px){
      .presseLayout{ grid-template-columns:1fr; }
    }

    /* Aperçu PDF – cliquable */
    .pdfPreview{
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 24px 70px rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.18);
      background:#0b1c28;
      cursor:pointer;
      position:relative;
    }
    .pdfPreview img{ width:100%; display:block; }
    .pdfPreview__overlay{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(2,37,58,.45);
      opacity:0;
      transition:opacity .2s;
    }
    .pdfPreview:hover .pdfPreview__overlay{ opacity:1; }
    .pdfPreview__overlay svg{
      width:64px; height:64px;
      fill:none; stroke:#fff;
      stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,.6));
    }

    /* Colonne texte */
    .presseText{
      max-width:42ch;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .presseText h2{ margin:0 0 10px; font-size:20px; font-weight:800; }
    .presseText p{ margin:0 0 18px; color:rgba(255,255,255,.8); line-height:1.6; font-size:16px; }

    .actions{ display:flex; gap:14px; flex-wrap:wrap; }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      height:44px; padding:0 18px;
      border-radius:999px;
      font-weight:800;
      border:1px solid rgba(255,255,255,.25);
      background:rgba(255,255,255,.08);
      color:#fff;
      text-decoration:none;
      cursor:pointer;
      font-family:inherit;
      font-size:inherit;
    }
    .btn:hover{ background:rgba(255,255,255,.14); }

    /* ══════════════════════════════════
       PDF LIGHTBOX
    ══════════════════════════════════ */
    .pdfModal{
      display:none;
      position:fixed;
      inset:0;
      z-index:1000;
      background:rgba(0,0,0,.82);
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
      align-items:center;
      justify-content:center;
      padding:24px;
      box-sizing:border-box;
    }
    .pdfModal.is-open{ display:flex; }

    .pdfModal__inner{
      position:relative;
      width:100%;
      max-width:860px;
      height:90vh;
      max-height:1000px;
      background:#0b1c28;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 32px 90px rgba(0,0,0,.7);
      border:1px solid rgba(255,255,255,.15);
      display:flex;
      flex-direction:column;
    }

    /* Barre du haut */
    .pdfModal__bar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 18px;
      background:rgba(255,255,255,.05);
      border-bottom:1px solid rgba(255,255,255,.10);
      flex-shrink:0;
    }
    .pdfModal__title{
      color:#fff;
      font-size:14px;
      font-weight:600;
      opacity:.85;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .pdfModal__actions{
      display:flex;
      gap:10px;
      flex-shrink:0;
    }
    .pdfModal__btn{
      display:inline-flex;
      align-items:center;
      gap:6px;
      height:34px;
      padding:0 14px;
      border-radius:999px;
      font-size:13px;
      font-weight:700;
      font-family:inherit;
      border:1px solid rgba(255,255,255,.22);
      background:rgba(255,255,255,.08);
      color:#fff;
      cursor:pointer;
      text-decoration:none;
      transition:background .15s;
    }
    .pdfModal__btn:hover{ background:rgba(255,255,255,.16); }
    .pdfModal__close{
      width:34px; height:34px; padding:0;
      font-size:20px;
      border-radius:50%;
    }

    /* iframe */
    .pdfModal__frame{
      flex:1;
      width:100%;
      border:none;
      display:block;
    }

    /* Fallback mobile (iOS ne supporte pas les PDF en iframe) */
    .pdfModal__fallback{
      display:none;
      flex:1;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:18px;
      padding:32px;
      text-align:center;
      color:rgba(255,255,255,.75);
      font-size:15px;
    }
    .pdfModal__fallback svg{
      width:56px; height:56px;
      opacity:.55;
    }

    @media (max-width:600px){
      .pdfModal{ padding:12px; }
      .pdfModal__inner{ height:95vh; border-radius:14px; }
      .pdfModal__frame{ display:none; }
      .pdfModal__fallback{ display:flex; }
    }
  </style>
</head>
