<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Parutions presse : Annick Bouvattier dans le magazine « Artistes », mai/juin 2019." />
  <meta name="theme-color" content="#02253A" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Annick Bouvattier" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:title" content="Presse — Annick Bouvattier" />
  <meta property="og:description" content="Parutions presse : Annick Bouvattier dans le magazine « Artistes », mai/juin 2019." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <title>Presse — Annick Bouvattier</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body.presse{ background:#02253A; }

    .headRow{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      margin:18px 0;
    }
    h1{ margin:0; font-size:28px; font-weight:800; }
    .meta{ color:rgba(255,255,255,.55); font-size:14px; }

    .presseLayout{
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      gap:32px;
      margin-top:24px;
      align-items:center;
    }
    @media (max-width:900px){
      .presseLayout{ grid-template-columns:1fr; }
    }

    /* Aperçu PDF – cliquable */
    .pdfPreview{
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 24px 70px rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.18);
      background:#0b1c28;
      cursor:pointer;
      position:relative;
    }
    .pdfPreview img{ width:100%; display:block; }
    .pdfPreview__overlay{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(2,37,58,.45);
      opacity:0;
      transition:opacity .2s;
    }
    .pdfPreview:hover .pdfPreview__overlay{ opacity:1; }
    .pdfPreview__overlay svg{
      width:64px; height:64px;
      fill:none; stroke:#fff;
      stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,.6));
    }

    /* Colonne texte */
    .presseText{
      max-width:42ch;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .presseText h2{ margin:0 0 10px; font-size:20px; font-weight:800; }
    .presseText p{ margin:0 0 18px; color:rgba(255,255,255,.8); line-height:1.6; font-size:16px; }

    .actions{ display:flex; gap:14px; flex-wrap:wrap; }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      height:44px; padding:0 18px;
      border-radius:999px;
      font-weight:800;
      border:1px solid rgba(255,255,255,.25);
      background:rgba(255,255,255,.08);
      color:#fff;
      text-decoration:none;
      cursor:pointer;
      font-family:inherit;
      font-size:inherit;
    }
    .btn:hover{ background:rgba(255,255,255,.14); }

    /* ══════════════════════════════════
       PDF LIGHTBOX
    ══════════════════════════════════ */
    .pdfModal{
      display:none;
      position:fixed;
      inset:0;
      z-index:1000;
      background:rgba(0,0,0,.82);
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
      align-items:center;
      justify-content:center;
      padding:24px;
      box-sizing:border-box;
    }
    .pdfModal.is-open{ display:flex; }

    .pdfModal__inner{
      position:relative;
      width:100%;
      max-width:860px;
      height:90vh;
      max-height:1000px;
      background:#0b1c28;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 32px 90px rgba(0,0,0,.7);
      border:1px solid rgba(255,255,255,.15);
      display:flex;
      flex-direction:column;
    }

    /* Barre du haut */
    .pdfModal__bar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 18px;
      background:rgba(255,255,255,.05);
      border-bottom:1px solid rgba(255,255,255,.10);
      flex-shrink:0;
    }
    .pdfModal__title{
      color:#fff;
      font-size:14px;
      font-weight:600;
      opacity:.85;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .pdfModal__actions{
      display:flex;
      gap:10px;
      flex-shrink:0;
    }
    .pdfModal__btn{
      display:inline-flex;
      align-items:center;
      gap:6px;
      height:34px;
      padding:0 14px;
      border-radius:999px;
      font-size:13px;
      font-weight:700;
      font-family:inherit;
      border:1px solid rgba(255,255,255,.22);
      background:rgba(255,255,255,.08);
      color:#fff;
      cursor:pointer;
      text-decoration:none;
      transition:background .15s;
    }
    .pdfModal__btn:hover{ background:rgba(255,255,255,.16); }
    .pdfModal__close{
      width:34px; height:34px; padding:0;
      font-size:20px;
      border-radius:50%;
    }

    /* iframe */
    .pdfModal__frame{
      flex:1;
      width:100%;
      border:none;
      display:block;
    }

    /* Fallback mobile (iOS ne supporte pas les PDF en iframe) */
    .pdfModal__fallback{
      display:none;
      flex:1;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:18px;
      padding:32px;
      text-align:center;
      color:rgba(255,255,255,.75);
      font-size:15px;
    }
    .pdfModal__fallback svg{
      width:56px; height:56px;
      opacity:.55;
    }

    @media (max-width:600px){
      .pdfModal{ padding:12px; }
      .pdfModal__inner{ height:95vh; border-radius:14px; }
      .pdfModal__frame{ display:none; }
      .pdfModal__fallback{ display:flex; }
    }
  </style>
</head>
<body class="presse">

<div class="page">
  <div class="container">

    <!-- HEADER -->
    <header class="top">
      <a class="brand" href="index.html">ANNICK&nbsp;BOUVATTIER</a>
      <nav class="top__nav" aria-label="Navigation principale">
        <a class="nav__link" href="index.html">Accueil</a>
        <a class="nav__link" href="portfolio.html">Portfolio</a>
        <a class="nav__link" href="galeries.html">Galeries</a>
        <a class="nav__link" href="expositions.html">Expositions</a>
        <a class="nav__link" href="apropos.html">À propos</a>
        <a class="nav__link is-active" aria-current="page" href="presse.html">Presse</a>
        <a class="nav__link" href="contact.html">Contact</a>
      </nav>
    </header>

    <!-- TITRE -->
    <div class="headRow">
      <h1>Presse</h1>
    </div>

    <!-- CONTENU -->
    <section class="presseLayout">

      <!-- Aperçu cliquable -->
      <div class="pdfPreview" role="button" tabindex="0"
           aria-label="Ouvrir le PDF en visualiseur"
           data-pdf="images/ArtistesAnnickBouvattier.pdf"
           data-title='Magazine "Artistes" — Mai/Juin 2019'>
        <img src="images/ArtistesCover.jpg" alt="Dossier de presse — Annick Bouvattier">
        <div class="pdfPreview__overlay" aria-hidden="true">
          <!-- icône "loupe / œil" -->
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>
      </div>

      <!-- Texte -->
      <div class="presseText">
        <h2>Parution dans le magazine "Artistes"</h2>
        <p>Mai/Juin 2019</p>
        <div class="actions">
          <button class="btn"
                  data-pdf="images/ArtistesAnnickBouvattier.pdf"
                  data-title='Magazine "Artistes" — Mai/Juin 2019'>
            Lire le PDF
          </button>
          <a class="btn" href="images/ArtistesAnnickBouvattier.pdf" download>
            Télécharger
          </a>
        </div>
      </div>

    </section>

    <footer class="siteFooter">
      <div class="siteFooter__social">
        <a href="https://www.instagram.com/annick.bouvattier/" target="_blank" rel="noopener noreferrer">instagram</a>
        <a href="https://www.facebook.com/annick.bouvattier/" target="_blank" rel="noopener noreferrer">facebook</a>
        <a href="https://www.saatchiart.com/bouvattier" target="_blank" rel="noopener noreferrer">saatchi art</a>
      </div>
      <a class="siteFooter__legal" href="mentions-legales.html">mentions légales</a>
    </footer>
  </div>
</div>

<!-- LIGHTBOX PDF -->
<div class="pdfModal" id="pdfModal" role="dialog" aria-modal="true" aria-labelledby="pdfModalTitle">
  <div class="pdfModal__inner">
    <div class="pdfModal__bar">
      <span class="pdfModal__title" id="pdfModalTitle"></span>
      <div class="pdfModal__actions">
        <a class="pdfModal__btn" id="pdfModalOpen" href="#" target="_blank" rel="noopener">Ouvrir</a>
        <a class="pdfModal__btn" id="pdfModalDownload" href="#" download>Télécharger</a>
        <button class="pdfModal__btn pdfModal__close" id="pdfModalClose" type="button" aria-label="Fermer">×</button>
      </div>
    </div>

    <iframe class="pdfModal__frame" id="pdfModalFrame" title="Aperçu du PDF"></iframe>

    <!-- Mobile : les navigateurs mobiles n'affichent pas les PDF en iframe -->
    <div class="pdfModal__fallback">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      <p>L'aperçu n'est pas disponible sur cet appareil.</p>
      <a class="btn" id="pdfFallbackOpen" href="#" target="_blank" rel="noopener">Ouvrir le PDF</a>
    </div>
  </div>
</div>

<script>
(() => {
  const modal = document.getElementById("pdfModal");
  const frame = document.getElementById("pdfModalFrame");
  const title = document.getElementById("pdfModalTitle");
  const openLinks = [document.getElementById("pdfModalOpen"), document.getElementById("pdfFallbackOpen")];
  const dlLink = document.getElementById("pdfModalDownload");
  const closeBtn = document.getElementById("pdfModalClose");
  const desktop = window.matchMedia("(min-width: 601px)");
  let lastTrigger = null;

  function openPdf(src, label, trigger){
    lastTrigger = trigger;
    title.textContent = label;
    openLinks.forEach(a => a.href = src);
    dlLink.href = src;
    // sur mobile l'iframe est masquée : on évite de télécharger le PDF pour rien
    if (desktop.matches) frame.src = src;
    modal.classList.add("is-open");
    document.body.style.overflow = "hidden";
    closeBtn.focus();
  }

  function closePdf(){
    modal.classList.remove("is-open");
    frame.removeAttribute("src");
    document.body.style.overflow = "";
    if (lastTrigger) lastTrigger.focus();
  }

  document.querySelectorAll("[data-pdf]").forEach(el => {
    const open = () => openPdf(el.dataset.pdf, el.dataset.title || "", el);
    el.addEventListener("click", open);
    el.addEventListener("keydown", (e) => {
      if (el.tagName === "BUTTON") return; // un <button> gère déjà Entrée/Espace
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
    });
  });

  closeBtn.addEventListener("click", closePdf);
  modal.addEventListener("click", (e) => { if (e.target === modal) closePdf(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modal.classList.contains("is-open")) closePdf();
  });
})();
</script>

</body>
