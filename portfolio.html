<body class="portfolio salle salle--portfolio">
  <div class="page">
    <div class="container">
      <header class="top">
        <a class="brand" href="index.html">ANNICK&nbsp;BOUVATTIER</a>
        <nav class="top__nav" aria-label="Navigation principale">
          <a class="nav__link" href="index.html">Accueil</a>

          <a class="nav__link" href="galeries.html">Galeries</a>

      <!-- Barre d'outils : onglets principaux + recherche, puis les choix de l'onglet ouvert -->
      <section class="toolbar" aria-label="Filtres">
        <div class="toolbar__row">
          <h1 class="sr-only">Portfolio</h1>
          <!-- chaque onglet affiche son choix en cours ; un clic déplie les choix en dessous ; × retire le filtre -->
          <div class="tabs" id="groups" aria-label="Filtrer par">
            <div class="group" data-group="category"><button class="tab tab--group" type="button" data-group="category" aria-expanded="false" aria-controls="subtabs"><span class="tab__name">Collection</span><span class="tab__value" translate="no"></span><svg class="tab__caret" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg></button><button class="group__clear" type="button" aria-label="Retirer ce filtre" title="Retirer ce filtre" hidden><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6"/></svg></button></div>
            <div class="group" data-group="technique"><button class="tab tab--group" type="button" data-group="technique" aria-expanded="false" aria-controls="subtabs"><span class="tab__name">Technique</span><span class="tab__value" translate="no"></span><svg class="tab__caret" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg></button><button class="group__clear" type="button" aria-label="Retirer ce filtre" title="Retirer ce filtre" hidden><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6"/></svg></button></div>
            <div class="group" data-group="format"><button class="tab tab--group" type="button" data-group="format" aria-expanded="false" aria-controls="subtabs"><span class="tab__name">Format</span><span class="tab__value" translate="no"></span><svg class="tab__caret" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg></button><button class="group__clear" type="button" aria-label="Retirer ce filtre" title="Retirer ce filtre" hidden><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6"/></svg></button></div>
            <div class="group" data-group="status"><button class="tab tab--group" type="button" data-group="status" aria-expanded="false" aria-controls="subtabs"><span class="tab__name">Disponibilité</span><span class="tab__value" translate="no"></span><svg class="tab__caret" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg></button><button class="group__clear" type="button" aria-label="Retirer ce filtre" title="Retirer ce filtre" hidden><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6"/></svg></button></div>
          </div>
          <label class="search">
            <svg class="search__icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
            <input id="q" type="search" placeholder="Rechercher" aria-label="Rechercher une œuvre" />
            <!-- nombre d'œuvres : affiché dans le placeholder, annoncé ici aux lecteurs d'écran -->
            <span class="sr-only" id="count" aria-live="polite">Chargement…</span>
          </label>
        </div>
        <!-- choix de l'onglet ouvert (+ tailles quand une forme est choisie dans Format) -->
        <div class="subtabs" id="subtabs" translate="no" hidden></div>
        <div class="subtabs subtabs--sizes" id="sizes" translate="no" hidden></div>
      </section>

      <section class="masonry" id="masonry" aria-label="Œuvres" translate="no"></section>
    <footer class="bottom">
        <div class="bottom__left">
          <a class="bottom__link" href="https://www.instagram.com/annick.bouvattier/" target="_blank" rel="noopener noreferrer">instagram</a>
          <a class="bottom__link" href="https://www.facebook.com/annick.bouvattier/" target="_blank" rel="noopener noreferrer">facebook</a>
          <a class="bottom__link" href="https://www.saatchiart.com/bouvattier" target="_blank" rel="noopener noreferrer">saatchi art</a>
        </div>
        <a class="bottom__link bottom__link--legal" href="mentions-legales.html">mentions légales</a>
      </footer>

  <script>
    /* =========================
       CONFIG
       ========================= */

    const SIZES_URL = "images/thumbs/sizes.json";  // dimensions des miniatures (évite les sauts de mise en page)

    /* =========================
       DOM
       ========================= */

    const els = {
      q: document.getElementById("q"),
      masonry: document.getElementById("masonry"),
      count: document.getElementById("count"),
      groups: document.getElementById("groups"),
      subtabs: document.getElementById("subtabs"),
      sizes: document.getElementById("sizes"),
    };

    let artworks = [];
    let sizesMap = {};      // nom de fichier -> [largeur, hauteur] de la miniature
    let currentList = [];   // œuvres actuellement affichées (après filtres)

    // plusieurs choix par onglet (Set vide = tous)
    const filters = {
      q: "",
      category: new Set(),
      technique: new Set(),
      shape: new Set(),    // "carre" | "paysage" | "portrait"
      size: new Set(),     // ex: "100 x 81 cm" normalisé (visible une fois la forme choisie)
      status: new Set(),   // "disponible" | "vendue"
    };

    // onglets principaux -> filtre concerné, libellé de « tout », libellé de chaque choix
    const GROUPS = {
      category:  { key: "category",  all: "Toutes", label: v => t(v) },
      technique: { key: "technique", all: "Toutes", label: v => t(v) },
      format:    { key: "shape",     all: "Tous",   label: shapeLabel, values: ["carre","paysage","portrait"] },
      status:    { key: "status",    all: "Tous",   label: statusLabel, values: ["disponible","vendue"] },
    };
    let activeGroup = null;   // onglet déplié (null = tous repliés)

    /* =========================
       HELPERS
       ========================= */

    function uniq(arr){ return [...new Set(arr)].sort((a,b)=> (""+a).localeCompare(""+b, "fr")); }

    const { escapeHtml, metaLine } = abouvModal;

    function normSize(s){
      return String(s ?? "")
        .toLowerCase()
        .replaceAll("×","x")
        .replace(/\s+/g," ")
        .replace(/\s*x\s*/g," x ")
        .replace(/\s*cm\s*/g," cm")
        .trim();
    }

    function parseDims(sizeStr){
      // attend un truc du style "100 x 81 cm" ou "100×81" ou "100 x 81"
      const s = normSize(sizeStr);
      const m = s.match(/(\d+(?:[.,]\d+)?)\s*x\s*(\d+(?:[.,]\d+)?)/i);
      if(!m) return null;
      const w = parseFloat(m[1].replace(",", "."));
      const h = parseFloat(m[2].replace(",", "."));
      if(!isFinite(w) || !isFinite(h)) return null;
      return { w, h };
    }

    function shapeFromSize(sizeStr){
      const d = parseDims(sizeStr);
      if(!d) return "unknown";
      if(Math.abs(d.w - d.h) < 0.0001) return "carre";
      return (d.w > d.h) ? "paysage" : "portrait";
    }

    function shapeLabel(key){
      if(key === "carre") return t("Carré");
      if(key === "paysage") return t("Paysage");
      if(key === "portrait") return t("Portrait");
      return t("Autre");
    }

    function statusLabel(s){
      return t(s === "vendue" ? "statut|Vendue" : "statut|Disponible");
    }

    /* =========================
       LOAD
       ========================= */

    async function loadSizes(){
      try{
        const res = await fetch(SIZES_URL);
        return res.ok ? await res.json() : {};
      }catch(_){ return {}; }
    }

    async function loadArtworksFromSheet(){
      const [list, sizes] = await Promise.all([abouvSheet.artworks(), loadSizes()]);
      sizesMap = sizes || {};

      // + format normalisé et orientation, pour les filtres
      return list.map(a => {
        const sizeNorm = a.size ? normSize(a.size) : "";
        return { ...a, sizeNorm, shape: a.size ? shapeFromSize(sizeNorm) : "unknown" };
      });
    }

    /* =========================
       CHIPS
       ========================= */

    function prettySize(sizeNorm){
      return sizeNorm.replace(/\s*x\s*/g," × ").replace(/\s*cm\s*/g," cm");
    }

    /* =========================
       FILTERING + RENDER
       ========================= */

    // ignore : filtres à ne pas appliquer (pour compter les œuvres de chaque choix d'un onglet)
    function matchArtwork(a, ignore = []){
      const on = (key) => filters[key].size && !ignore.includes(key);
      if(a.broken) return false; // image introuvable (ni miniature ni original)
      const q = (filters.q||"").trim().toLowerCase();
      if(q && !a.title.toLowerCase().includes(q)) return false;

      if(on("category") && !filters.category.has(a.category)) return false;
      if(on("technique") && !filters.technique.has(a.technique)) return false;

      // Format : forme + tailles (AND)
      if(on("shape") && !filters.shape.has(a.shape)) return false;
      if(on("size") && !filters.size.has(a.sizeNorm)) return false;

      if(on("status") && !filters.status.has(a.status)) return false;

      return true;
    }

    let renderQueued = false;
    function scheduleRender(){
      if(renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(() => { renderQueued = false; render(); });
    }

    /* =========================
       ONGLETS
       ========================= */

    // une ligne de choix : « Tous » + un bouton par valeur, avec le nombre d'œuvres (les choix vides sont masqués)
    // plusieurs choix possibles : un clic coche / décoche, « Toutes » efface la ligne
    function fillChoices(box, key, allLabel, items, onChange){
      const set = filters[key];
      box.innerHTML = "";
      items.forEach(it => {
        if(!it.n && it.value && !set.has(it.value)) return;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab tab--sub";
        btn.setAttribute("aria-pressed", String(it.value ? set.has(it.value) : set.size === 0));
        btn.innerHTML = `<span>${escapeHtml(it.value ? it.label : t(allLabel))}</span><span class="tab__count">${it.n}</span>`;
        btn.addEventListener("click", () => {
          if(!it.value) set.clear();
          else if(set.has(it.value)) set.delete(it.value);
          else set.add(it.value);
          onChange && onChange();
          render();
        });
        box.appendChild(btn);
      });
    }

    // choix en cours d'un onglet, affiché à côté de son nom (« Toutes » s'il n'y a pas de filtre)
    // onglet replié : le 1er choix + le nombre d'autres (« Danseuses +2 »)
    function groupValue(name){
      const g = GROUPS[name];
      const short = (list) => list[0] + (list.length > 1 ? ` +${list.length - 1}` : "");
      const vals = [...filters[g.key]].map(g.label);
      if(!vals.length) return t(g.all);
      if(name === "format" && filters.size.size) return `${short(vals)} · ${short([...filters.size].map(prettySize))}`;
      return short(vals);
    }

    function renderTabs(){
      els.groups.querySelectorAll(".tab").forEach(btn => {
        const name = btn.dataset.group;
        const on = filters[GROUPS[name].key].size > 0;
        btn.setAttribute("aria-expanded", String(name === activeGroup));
        btn.parentElement.classList.toggle("has-filter", on);
        btn.nextElementSibling.hidden = !on;
        btn.querySelector(".tab__value").textContent = groupValue(name);
      });

      els.subtabs.hidden = !activeGroup;
      els.sizes.hidden = true;
      if(!activeGroup) return;

      const g = GROUPS[activeGroup];
      const pool = artworks.filter(a => matchArtwork(a, g.key === "shape" ? ["shape","size"] : [g.key]));
      const values = g.values || uniq(artworks.map(a => a[g.key]).filter(Boolean));
      fillChoices(els.subtabs, g.key, g.all, [{ value: "", n: pool.length }]
        .concat(values.map(v => ({ value: v, label: g.label(v), n: pool.filter(a => a[g.key] === v).length }))),
        g.key === "shape" ? () => filters.size.clear() : null);

      // Format : une fois une forme choisie, ses tailles en dessous
      const showSizes = activeGroup === "format" && filters.shape.size > 0;
      els.sizes.hidden = !showSizes;
      if(showSizes){
        const sizePool = artworks.filter(a => matchArtwork(a, ["size"]));
        const area = (v) => { const d = parseDims(v); return d ? d.w * d.h : 0; };
        const sizes = uniq(sizePool.map(a => a.sizeNorm).filter(Boolean)).sort((a, b) => area(a) - area(b));
        fillChoices(els.sizes, "size", "Toutes", [{ value: "", n: sizePool.length }]
          .concat(sizes.map(v => ({ value: v, label: prettySize(v), n: sizePool.filter(a => a.sizeNorm === v).length }))));
      }
    }

    function render(){
      renderTabs();

      const list = artworks.filter(a => matchArtwork(a));
      currentList = list;

      els.masonry.innerHTML = "";

      if(!list.length){
        els.masonry.innerHTML = `<p class="statusMsg">${t("Aucune œuvre ne correspond à ces filtres.")}</p>`;
      }

      list.forEach((a, idx)=>{
        const item = document.createElement("article");
        item.className = "piece";
        item.tabIndex = 0;
        item.setAttribute("role", "button");
        item.setAttribute("aria-label", `${a.title} — ${statusLabel(a.status)}. ${t("Ouvrir l'œuvre")}`);

        const dims = sizesMap[a.file];
        const dimAttrs = dims ? ` width="${dims[0]}" height="${dims[1]}"` : "";
        const meta = metaLine(a);

        item.innerHTML = `
          <div class="imgWrap">
            <img src="${a.thumb}" alt="${escapeHtml(a.title)}"${dimAttrs} loading="lazy" decoding="async">
          </div>
          <div class="cap">
            <p class="capTitle">${escapeHtml(a.title)}</p>
            ${meta ? `<p class="capMeta">${meta}</p>` : ""}
            <span class="badge ${a.status}">
              ${statusLabel(a.status)}
            </span>
          </div>
        `;

        // miniature absente -> image d'origine ; si elle manque aussi -> l'œuvre est masquée
        const img = item.querySelector("img");
        let triedOriginal = false;
        img.addEventListener("error", () => {
          if(!triedOriginal){ triedOriginal = true; img.src = a.image; return; }
          console.warn("Image introuvable, œuvre masquée :", a.title, a.image);
          a.broken = true;
          scheduleRender();
        });

        item.addEventListener("click", ()=> abouvModal.open(currentList, idx));
        item.addEventListener("keydown", (e)=>{
          if(e.key === "Enter" || e.key === " "){ e.preventDefault(); abouvModal.open(currentList, idx); }
        });
        els.masonry.appendChild(item);
      });

      const n = `${list.length} ${t(list.length>1 ? "œuvres" : "œuvre")}`;
      els.count.textContent = n;
      els.q.placeholder = `${t("Rechercher parmi")} ${n}`;
    }

    /* =========================
       MODAL
       ========================= */

    /* =========================
       EVENTS
       ========================= */

    els.q.addEventListener("input", () => {
      filters.q = els.q.value || "";
      render();
    });

    els.groups.addEventListener("click", (e) => {
      const clear = e.target.closest(".group__clear");
      if(clear){
        const g = GROUPS[clear.parentElement.dataset.group];
        filters[g.key].clear();
        if(g.key === "shape") filters.size.clear();
        render();
        return;
      }
      const btn = e.target.closest(".tab");
      if(!btn) return;
      activeGroup = (activeGroup === btn.dataset.group) ? null : btn.dataset.group;
      renderTabs();
    });

    // clic en dehors de la barre ou Échap : on replie
    document.addEventListener("click", (e) => {
      // composedPath : le bouton cliqué a pu être retiré de la page entre-temps (choix redessinés)
      const inside = e.composedPath().some(n => n.classList && n.classList.contains("toolbar"));
      if(activeGroup && !inside){ activeGroup = null; renderTabs(); }
    });

    document.addEventListener("keydown", (e)=>{
      if(e.key === "Escape" && activeGroup && !abouvModal.isOpen()){
        const btn = els.groups.querySelector(`[data-group="${activeGroup}"]`);
        activeGroup = null;
        renderTabs();
        btn.focus();
      }
    });

    /* =========================
       INIT
       ========================= */

    document.addEventListener("DOMContentLoaded", async () => {
      // ?q=<titre> (liens de la galerie 3D) : recherche pré-remplie
      const q0 = new URLSearchParams(location.search).get("q");
      if(q0){ els.q.value = q0.slice(0, 80); filters.q = els.q.value; }
      try{
        artworks = await loadArtworksFromSheet();
        render();
        // ?oeuvre=<fichier> (clic sur une toile de la galerie 3D) : sa fiche s'ouvre directement
        const wanted = new URLSearchParams(location.search).get("oeuvre");
        const at = wanted ? currentList.findIndex(a => a.file === wanted || a.title === wanted) : -1;
        if(at >= 0) abouvModal.open(currentList, at);
      } catch(err){
        console.error(err);
        els.count.textContent = "";
        els.masonry.innerHTML =
          `<p class="statusMsg">${t("Impossible de charger les œuvres pour le moment. Vérifiez votre connexion, puis")} ` +
          `<a href="portfolio.html">${t("actualisez la page")}</a>.</p>`;
      }
    });
  </script>
