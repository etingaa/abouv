  <script>
    /* =========================
       CONFIG
       ========================= */

    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSmK-RAKlpq_VMnhd78eWdWeMTnCkU3_-411IzeTyzO9j0zbJdkkhzfxlRDZpqzKixpoUgTtAAI_Auw/pub?output=csv";
    const IMG_BASE = "images";
    const THUMB_BASE = "images/thumbs";            // générées par scripts/make-thumbs.py
    const SIZES_URL = "images/thumbs/sizes.json";  // dimensions des miniatures (évite les sauts de mise en page)
    const CACHE_KEY = "abouv:sheet-csv";           // dernière version du Sheet, si Google est injoignable

    /* =========================
       DOM
       ========================= */

    const els = {
      q: document.getElementById("q"),
      reset: document.getElementById("reset"),
      masonry: document.getElementById("masonry"),
      count: document.getElementById("count"),
      chips: document.getElementById("chips"),
      tabs: document.getElementById("tabs"),

      modal: document.getElementById("modal"),
      modalImg: document.getElementById("modalImg"),
      modalTitle: document.getElementById("modalTitle"),
      modalMeta: document.getElementById("modalMeta"),
      modalClose: document.getElementById("modalClose"),
      modalPrev: document.getElementById("modalPrev"),
      modalNext: document.getElementById("modalNext"),
      modalCta: document.getElementById("modalCta"),
    };

    const ddEls = {
      technique: document.querySelector('.dd[data-key="technique"]'),
      format: document.querySelector('.dd[data-key="format"]'),
      status: document.querySelector('.dd[data-key="status"]'),
    };

    const panels = {
      technique: document.querySelector('[data-panel="technique"]'),
      format: document.querySelector('[data-panel="format"]'),
      status: document.querySelector('[data-panel="status"]'),
    };

    const countBadges = {
      technique: document.querySelector('[data-count="technique"]'),
      format: document.querySelector('[data-count="format"]'),
      status: document.querySelector('[data-count="status"]'),
    };

    let artworks = [];
    let sizesMap = {};      // nom de fichier -> [largeur, hauteur] de la miniature
    let currentList = [];   // œuvres actuellement affichées (après filtres)
    let modalIndex = -1;

    // filtres multi
    const filters = {
      q: "",
      category: new Set(),  // un seul onglet à la fois ; vide = toutes
      technique: new Set(),
      // format = 2 sous-filtres dans le même dropdown
      shape: new Set(),    // "carre" | "paysage" | "portrait"
      size: new Set(),     // ex: "100 x 81 cm" normalisé
      status: new Set(),   // "disponible" | "vendue"
    };

    /* =========================
       HELPERS
       ========================= */

    function uniq(arr){ return [...new Set(arr)].sort((a,b)=> (""+a).localeCompare(""+b, "fr")); }

    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function normalizeHeader(h){
      return String(h ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    function normSize(s){
      return String(s ?? "")
        .toLowerCase()
        .replaceAll("×","x")
        .replace(/\s+/g," ")
        .replace(/\s*x\s*/g," x ")
        .replace(/\s*cm\s*/g," cm")
        .trim();
    }

    function parseDims(sizeStr){
      // attend un truc du style "100 x 81 cm" ou "100×81" ou "100 x 81"
      const s = normSize(sizeStr);
      const m = s.match(/(\d+(?:[.,]\d+)?)\s*x\s*(\d+(?:[.,]\d+)?)/i);
      if(!m) return null;
      const w = parseFloat(m[1].replace(",", "."));
      const h = parseFloat(m[2].replace(",", "."));
      if(!isFinite(w) || !isFinite(h)) return null;
      return { w, h };
    }

    function shapeFromSize(sizeStr){
      const d = parseDims(sizeStr);
      if(!d) return "unknown";
      if(Math.abs(d.w - d.h) < 0.0001) return "carre";
      return (d.w > d.h) ? "paysage" : "portrait";
    }

    function shapeLabel(key){
      if(key === "carre") return t("Carré");
      if(key === "paysage") return t("Paysage");
      if(key === "portrait") return t("Portrait");
      return t("Autre");
    }

    // CSV robuste (gère guillemets + virgules)
    function parseCSV(text){
      const rows = [];
      let row = [];
      let value = "";
      let inQuotes = false;

      for(let i=0;i<text.length;i++){
        const c = text[i];
        const next = text[i+1];

        if(c === '"' && next === '"'){
          value += '"';
          i++;
          continue;
        }
        if(c === '"'){
          inQuotes = !inQuotes;
          continue;
        }
        if(c === "," && !inQuotes){
          row.push(value.trim());
          value = "";
          continue;
        }
        if((c === "\n" || c === "\r") && !inQuotes){
          if(value.length || row.length){
            row.push(value.trim());
            rows.push(row);
            row = [];
            value = "";
          }
          continue;
        }
        value += c;
      }

      if(value.length || row.length){
        row.push(value.trim());
        rows.push(row);
      }

      return rows;
    }

    function cleanNA(v){
      const s = String(v ?? "").trim();
      if(!s) return "";
      if(s.toUpperCase() === "N/A") return "";
      return s;
    }

    function statusFromSheet(v){
      const s = String(v ?? "").trim().toUpperCase();
      return (s === "VENDUE") ? "vendue" : "disponible";
    }

    function cleanFile(jpg){
      return String(jpg || "").trim().replace(/^images\//i, "").replace(/^\/+/, "");
    }

    function buildImagePath(file, base = IMG_BASE){
      return encodeURI(`${base}/${file}`);
    }

    function statusLabel(s){
      return t(s === "vendue" ? "statut|Vendue" : "statut|Disponible");
    }

    // "Huile sur Toile · 60 x 120 cm" (sans les champs vides) — technique traduite en anglais
    function metaLine(a){
      return [a.technique && t(a.technique), a.size].filter(Boolean).map(escapeHtml).join(" · ");
    }

    function setBadgeCount(key){
      let n = 0;
      if(key === "format"){
        n = filters.shape.size + filters.size.size;
      }else{
        n = filters[key].size;
      }
      countBadges[key].textContent = n ? String(n) : "";
    }

    function closeAllDropdowns(){
      Object.values(ddEls).forEach(dd => {
        dd.classList.remove("is-open");
        const btn = dd.querySelector("button[aria-expanded]");
        if(btn) btn.setAttribute("aria-expanded", "false");
      });
    }

    /* =========================
       LOAD
       ========================= */

    async function fetchSheetCSV(){
      try{
        const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
        if(!res.ok) throw new Error("Impossible de charger la Google Sheet");
        const csv = await res.text();
        try{ localStorage.setItem(CACHE_KEY, csv); }catch(_){}
        return csv;
      }catch(err){
        // Google injoignable / Sheet dépubliée : on affiche la dernière version connue
        let cached = null;
        try{ cached = localStorage.getItem(CACHE_KEY); }catch(_){}
        if(cached){ console.warn("Sheet injoignable, utilisation de la copie locale.", err); return cached; }
        throw err;
      }
    }

    async function loadSizes(){
      try{
        const res = await fetch(SIZES_URL);
        return res.ok ? await res.json() : {};
      }catch(_){ return {}; }
    }

    async function loadArtworksFromSheet(){
      const [csv, sizes] = await Promise.all([fetchSheetCSV(), loadSizes()]);
      sizesMap = sizes || {};

      const rows = parseCSV(csv);
      if(!rows.length) throw new Error("Sheet vide");

      const header = rows.shift().map(normalizeHeader);
      const col = (name) => header.indexOf(normalizeHeader(name));

      // Sheet : Nom | Année | Catégorie | Technique | Format | Disponible | Jpg | Disponible où ? | Accueil
      return rows
        .filter(r => r[col("nom")])
        .map(r => {
          const title = cleanNA(r[col("nom")]);
          const category = cleanNA(r[col("categorie")]);
          const technique = cleanNA(r[col("technique")]);
          const formatRaw = cleanNA(r[col("format")]);
          const status = statusFromSheet(r[col("disponible")]);
          const where = cleanNA(r[col("disponible ou ?")]);
          const file = cleanFile(cleanNA(r[col("jpg")]));

          const size = formatRaw ? `${formatRaw} cm` : "";
          const sizeNorm = size ? normSize(size) : "";
          const shape = size ? shapeFromSize(sizeNorm) : "unknown";

          const image = file ? buildImagePath(file) : "";
          const thumb = file ? buildImagePath(file, THUMB_BASE) : "";

          return { title, category, technique, size, sizeNorm, shape, status, where, file, image, thumb };
        })
        .filter(a => a.title && a.image);
    }

    /* =========================
       PANELS (Category / Technique / Status)
       ========================= */

    function buildSimplePanel(key, options, labelFn = (v) => v){
      const panel = panels[key];
      panel.innerHTML = "";

      options.forEach(v => {
        const row = document.createElement("label");
        row.className = "ddRow";

        const input = document.createElement("input");
        input.type = "checkbox";
        input.value = v;
        input.checked = filters[key].has(v);

        const label = document.createElement("span");
        label.className = "ddLabel";
        label.textContent = labelFn(v);

        input.addEventListener("change", () => {
          if(input.checked) filters[key].add(v);
          else filters[key].delete(v);

          setBadgeCount(key);
          renderChips();
          render();
        });

        row.appendChild(input);
        row.appendChild(label);
        panel.appendChild(row);
      });

      setBadgeCount(key);
    }

    /* =========================
       PANEL FORMAT (Forme + Tailles)
       ========================= */

    function addHeading(panel, text){
      const h = document.createElement("div");
      h.className = "ddHeading";
      h.textContent = text;
      panel.appendChild(h);
    }

    function addSeparator(panel){
      const sep = document.createElement("div");
      sep.className = "ddSep";
      panel.appendChild(sep);
    }

    function addCheckboxRow(panel, checked, labelText, onChange){
      const row = document.createElement("label");
      row.className = "ddRow";

      const input = document.createElement("input");
      input.type = "checkbox";
      input.checked = checked;

      const label = document.createElement("span");
      label.className = "ddLabel";
      label.textContent = labelText;

      input.addEventListener("change", () => onChange(input.checked));

      row.appendChild(input);
      row.appendChild(label);
      panel.appendChild(row);
    }

    function buildFormatPanel(){
  const panel = panels.format;
  panel.innerHTML = "";

  const sizesByShape = {
    carre: uniq(artworks.filter(a => a.shape === "carre").map(a => a.sizeNorm).filter(Boolean)),
    paysage: uniq(artworks.filter(a => a.shape === "paysage").map(a => a.sizeNorm).filter(Boolean)),
    portrait: uniq(artworks.filter(a => a.shape === "portrait").map(a => a.sizeNorm).filter(Boolean)),
  };

  function prettySize(sizeNorm){
    return sizeNorm.replace(/\s*x\s*/g," × ").replace(/\s*cm\s*/g," cm");
  }

  function groupBlock(shapeKey){
    const label = shapeLabel(shapeKey);
    const isOn = filters.shape.has(shapeKey);
    const list = sizesByShape[shapeKey];

    // Ligne Carré / Paysage / Portrait avec checkbox
    const row = document.createElement("label");
    row.className = "ddRow";

    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = isOn;

    const text = document.createElement("span");
    text.className = "ddLabel";
    text.style.fontWeight = "900";
    text.style.letterSpacing = ".08em";
    text.style.textTransform = "uppercase";
    text.textContent = label;

    input.addEventListener("change", () => {
      if(input.checked) filters.shape.add(shapeKey);
      else filters.shape.delete(shapeKey);

      setBadgeCount("format");
      renderChips();
      render();

      // reconstruit le panel pour afficher/cacher les tailles
      buildFormatPanel();
    });

    row.appendChild(input);
    row.appendChild(text);
    panel.appendChild(row);

    // Tailles visibles uniquement si la forme est cochée
    if(input.checked){
      const wrap = document.createElement("div");
      wrap.style.padding = "4px 0 10px 34px";  // indentation
      wrap.style.display = "grid";
      wrap.style.gap = "6px";

      list.forEach(sizeNorm => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = prettySize(sizeNorm);

        // style minimal sans toucher ton CSS
        btn.style.textAlign = "left";
        btn.style.padding = "8px 10px";
        btn.style.borderRadius = "10px";
        btn.style.border = "1px solid rgba(255,255,255,.18)";
        btn.style.background = filters.size.has(sizeNorm)
          ? "rgba(61,220,132,.18)"
          : "rgba(255,255,255,.06)";
        btn.style.color = "rgba(255,255,255,.92)";
        btn.style.cursor = "pointer";

        btn.addEventListener("click", () => {
          if(filters.size.has(sizeNorm)) filters.size.delete(sizeNorm);
          else filters.size.add(sizeNorm);

          setBadgeCount("format");
          renderChips();
          render();

          // refresh visuel
          buildFormatPanel();
        });

        wrap.appendChild(btn);
      });

      panel.appendChild(wrap);
    }

    // séparateur entre groupes
    const sep = document.createElement("div");
    sep.className = "ddSep";
    panel.appendChild(sep);
  }

  groupBlock("carre");
  groupBlock("paysage");
  groupBlock("portrait");

  setBadgeCount("format");
}


    function hydrateDropdowns(){
      const techniques = uniq(artworks.map(a => a.technique).filter(Boolean));
      const statuses = ["disponible","vendue"];

      buildSimplePanel("technique", techniques, t);
      buildFormatPanel();
      buildSimplePanel("status", statuses, statusLabel);
    }

    /* =========================
       CHIPS
       ========================= */

    function renderChips(){
      const chips = [];

      filters.technique.forEach(v => chips.push({ key:"technique", label: t(v), raw: v }));

      filters.shape.forEach(v => chips.push({ key:"shape", label: shapeLabel(v), raw: v }));
      filters.size.forEach(v => {
        const display = v.replace(/\s*x\s*/g," × ").replace(/\s*cm\s*/g," cm");
        chips.push({ key:"size", label: display, raw: v });
      });

      filters.status.forEach(v => chips.push({ key:"status", label: t(v==="vendue"?"VENDUE":"DISPONIBLE"), raw: v }));

      els.chips.innerHTML = "";

      chips.forEach(c => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.innerHTML = `
          <span>${escapeHtml(c.label)}</span>
          <button type="button" aria-label="${escapeHtml(t("Retirer"))}">×</button>
        `;

        chip.querySelector("button").addEventListener("click", () => {
          // raw = valeur d'origine (le libellé affiché peut être traduit)
          filters[c.key].delete(c.raw);

          setBadgeCount("technique");
          setBadgeCount("format");
          setBadgeCount("status");

          // rebuild format panel to sync checkboxes
          buildFormatPanel();

          // rebuild other panels to sync checkboxes
          syncSimplePanel("technique");
          syncSimplePanel("status");

          renderChips();
          render();
        });

        els.chips.appendChild(chip);
      });
    }

    function syncSimplePanel(key){
      const panel = panels[key];
      const inputs = panel.querySelectorAll('input[type="checkbox"]');
      inputs.forEach(inp => {
        const v = inp.value;
        inp.checked = filters[key].has(v);
      });
    }

    /* =========================
       FILTERING + RENDER
       ========================= */

    // ignoreCategory : sert à compter les œuvres de chaque onglet avec les autres filtres
    function matchArtwork(a, ignoreCategory = false){
      if(a.broken) return false; // image introuvable (ni miniature ni original)
      const q = (filters.q||"").trim().toLowerCase();
      if(q && !a.title.toLowerCase().includes(q)) return false;

      if(!ignoreCategory && filters.category.size && !filters.category.has(a.category)) return false;
      if(filters.technique.size && !filters.technique.has(a.technique)) return false;

      // Format : forme + tailles (AND)
      if(filters.shape.size && !filters.shape.has(a.shape)) return false;
      if(filters.size.size && !filters.size.has(a.sizeNorm)) return false;

      if(filters.status.size && !filters.status.has(a.status)) return false;

      return true;
    }

    let renderQueued = false;
    function scheduleRender(){
      if(renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(() => { renderQueued = false; render(); });
    }

    /* =========================
       ONGLETS (Catégorie)
       ========================= */

    function renderTabs(){
      const pool = artworks.filter(a => matchArtwork(a, true));
      const categories = uniq(artworks.map(a => a.category).filter(Boolean));
      const active = [...filters.category][0] || "";

      const tabs = [{ value: "", label: t("Toutes"), n: pool.length }]
        .concat(categories.map(c => ({ value: c, label: t(c), n: pool.filter(a => a.category === c).length })));

      els.tabs.innerHTML = "";
      tabs.forEach(tab => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab";
        btn.setAttribute("aria-pressed", String(tab.value === active));
        btn.innerHTML = `<span>${escapeHtml(tab.label)}</span><span class="tab__count">${tab.n}</span>`;
        btn.addEventListener("click", () => {
          filters.category.clear();
          if(tab.value) filters.category.add(tab.value);
          render();
        });
        els.tabs.appendChild(btn);
      });
    }

    function hasActiveFilters(){
      return Boolean(filters.q.trim() || filters.category.size || filters.technique.size ||
        filters.shape.size || filters.size.size || filters.status.size);
    }

    function render(){
      renderTabs();
      els.reset.hidden = !hasActiveFilters();

      const list = artworks.filter(a => matchArtwork(a));
      currentList = list;

      els.masonry.innerHTML = "";

      if(!list.length){
        els.masonry.innerHTML = `<p class="statusMsg">${t("Aucune œuvre ne correspond à ces filtres.")}</p>`;
      }

      list.forEach((a, idx)=>{
        const item = document.createElement("article");
        item.className = "piece";
        item.tabIndex = 0;
        item.setAttribute("role", "button");
        item.setAttribute("aria-label", `${a.title} — ${statusLabel(a.status)}. ${t("Ouvrir l'œuvre")}`);

        const dims = sizesMap[a.file];
        const dimAttrs = dims ? ` width="${dims[0]}" height="${dims[1]}"` : "";
        const meta = metaLine(a);

        item.innerHTML = `
          <div class="imgWrap">
            <img src="${a.thumb}" alt="${escapeHtml(a.title)}"${dimAttrs} loading="lazy" decoding="async">
          </div>
          <div class="cap">
            <p class="capTitle">${escapeHtml(a.title)}</p>
            ${meta ? `<p class="capMeta">${meta}</p>` : ""}
            <span class="badge ${a.status}">
              ${t(a.status === "vendue" ? "VENDUE" : "DISPONIBLE")}
            </span>
          </div>
        `;

        // miniature absente -> image d'origine ; si elle manque aussi -> l'œuvre est masquée
        const img = item.querySelector("img");
        let triedOriginal = false;
        img.addEventListener("error", () => {
          if(!triedOriginal){ triedOriginal = true; img.src = a.image; return; }
          console.warn("Image introuvable, œuvre masquée :", a.title, a.image);
          a.broken = true;
          scheduleRender();
        });

        item.addEventListener("click", ()=> openModal(idx));
        item.addEventListener("keydown", (e)=>{
          if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openModal(idx); }
        });
        els.masonry.appendChild(item);
      });

      els.count.textContent = `${list.length} ${t(list.length>1 ? "œuvres" : "œuvre")}`;
    }

    /* =========================
       MODAL
       ========================= */

    function showArtwork(idx){
      const n = currentList.length;
      if(!n) return;
      modalIndex = (idx + n) % n;
      const a = currentList[modalIndex];

      // miniature tout de suite, puis image d'origine dès qu'elle est chargée
      els.modalImg.src = a.thumb;
      els.modalImg.alt = a.title;
      const full = new Image();
      full.onload = () => { if(currentList[modalIndex] === a) els.modalImg.src = a.image; };
      full.src = a.image;

      els.modalTitle.textContent = a.title.toUpperCase();

      const label = t(a.status === "vendue" ? "VENDUE" : "DISPONIBLE");
      const parts = [];
      const meta = metaLine(a);
      if(meta) parts.push(meta);
      parts.push(`<span class="statusText ${a.status}">${label}</span>` +
                 (a.status === "disponible" && a.where ? ` · ${escapeHtml(t(a.where))}` : ""));
      els.modalMeta.innerHTML = parts.join(" · ");

      // œuvre disponible -> lien vers le formulaire, message pré-rempli
      els.modalCta.hidden = a.status !== "disponible";
      els.modalCta.href = "contact.html?oeuvre=" + encodeURIComponent(a.title);

      const multi = n > 1;
      els.modalPrev.hidden = !multi;
      els.modalNext.hidden = !multi;
    }

    function openModal(idx){
      showArtwork(idx);
      document.body.style.overflow = "hidden"; // pas de scroll de la page derrière
      els.modal.showModal();
    }

    function closeModal(){ if(els.modal.open) els.modal.close(); }

    /* =========================
       EVENTS
       ========================= */

    els.q.addEventListener("input", () => {
      filters.q = els.q.value || "";
      render();
    });

    els.reset.addEventListener("click", ()=>{
      filters.q = "";
      filters.category.clear();
      filters.technique.clear();
      filters.shape.clear();
      filters.size.clear();
      filters.status.clear();

      els.q.value = "";

      // rebuild panels to reset checks
      hydrateDropdowns();

      renderChips();
      render();
    });

    Object.values(ddEls).forEach(dd => {
      const btn = dd.querySelector(".pillBtn");
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const isOpen = dd.classList.contains("is-open");
        closeAllDropdowns();
        if(!isOpen){
          dd.classList.add("is-open");
          btn.setAttribute("aria-expanded", "true");
        }
      });
    });

    document.addEventListener("click", () => closeAllDropdowns());
    Object.values(panels).forEach(p => p.addEventListener("click", (e) => e.stopPropagation()));

    els.modalClose.addEventListener("click", closeModal);
    els.modalPrev.addEventListener("click", ()=> showArtwork(modalIndex - 1));
    els.modalNext.addEventListener("click", ()=> showArtwork(modalIndex + 1));
    // clic sur le fond ou sur la zone vide autour de l'image -> fermer
    els.modal.addEventListener("click", (e)=>{
      const t = e.target;
      if(t === els.modal || t.classList.contains("modal") || t.classList.contains("modal__media")) closeModal();
    });
    // "close" couvre aussi la touche Échap gérée nativement par <dialog>
    els.modal.addEventListener("close", ()=>{ document.body.style.overflow = ""; });

    document.addEventListener("keydown", (e)=>{
      if(els.modal.open){
        if(e.key === "ArrowLeft") showArtwork(modalIndex - 1);
        if(e.key === "ArrowRight") showArtwork(modalIndex + 1);
        return;
      }
      if(e.key === "Escape"){
        const open = Object.values(ddEls).find(dd => dd.classList.contains("is-open"));
        if(open){
          closeAllDropdowns();
          open.querySelector(".pillBtn").focus();
        }
      }
    });

    /* =========================
       INIT
       ========================= */

    document.addEventListener("DOMContentLoaded", async () => {
      try{
        artworks = await loadArtworksFromSheet();
        hydrateDropdowns();
        renderChips();
        render();
      } catch(err){
        console.error(err);
        els.count.textContent = "";
        els.masonry.innerHTML =
          `<p class="statusMsg">${t("Impossible de charger les œuvres pour le moment. Vérifiez votre connexion, puis")} ` +
          `<a href="portfolio.html">${t("actualisez la page")}</a>.</p>`;
      }
    });
  </script>
</body>
</html>
