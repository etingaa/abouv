  <script>
    /* =========================
       CONFIG
       ========================= */

    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSmK-RAKlpq_VMnhd78eWdWeMTnCkU3_-411IzeTyzO9j0zbJdkkhzfxlRDZpqzKixpoUgTtAAI_Auw/pub?output=csv";
    const IMG_BASE = "images";
    const THUMB_BASE = "images/thumbs";            // générées par scripts/make-thumbs.py
    const SIZES_URL = "images/thumbs/sizes.json";  // dimensions des miniatures (évite les sauts de mise en page)
    const CACHE_KEY = "abouv:sheet-csv";           // dernière version du Sheet, si Google est injoignable

    /* =========================
       DOM
       ========================= */

    const els = {
      q: document.getElementById("q"),
      reset: document.getElementById("reset"),
      masonry: document.getElementById("masonry"),
      count: document.getElementById("count"),
      groups: document.getElementById("groups"),
      subtabs: document.getElementById("subtabs"),
      sizes: document.getElementById("sizes"),

      modal: document.getElementById("modal"),
      modalImg: document.getElementById("modalImg"),
      modalTitle: document.getElementById("modalTitle"),
      modalMeta: document.getElementById("modalMeta"),
      modalClose: document.getElementById("modalClose"),
      modalPrev: document.getElementById("modalPrev"),
      modalNext: document.getElementById("modalNext"),
      modalCta: document.getElementById("modalCta"),
    };

    let artworks = [];
    let sizesMap = {};      // nom de fichier -> [largeur, hauteur] de la miniature
    let currentList = [];   // œuvres actuellement affichées (après filtres)
    let modalIndex = -1;

    // plusieurs choix par onglet (Set vide = tous)
    const filters = {
      q: "",
      category: new Set(),
      technique: new Set(),
      shape: new Set(),    // "carre" | "paysage" | "portrait"
      size: new Set(),     // ex: "100 x 81 cm" normalisé (visible une fois la forme choisie)
      status: new Set(),   // "disponible" | "vendue"
    };

    // onglets principaux -> filtre concerné, libellé de « tout », libellé de chaque choix
    const GROUPS = {
      category:  { key: "category",  all: "Toutes", label: v => t(v) },
      technique: { key: "technique", all: "Toutes", label: v => t(v) },
      format:    { key: "shape",     all: "Tous",   label: shapeLabel, values: ["carre","paysage","portrait"] },
      status:    { key: "status",    all: "Tous",   label: statusLabel, values: ["disponible","vendue"] },
    };
    let activeGroup = null;   // onglet déplié (null = tous repliés)

    /* =========================
       HELPERS
       ========================= */

    function uniq(arr){ return [...new Set(arr)].sort((a,b)=> (""+a).localeCompare(""+b, "fr")); }

    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function normalizeHeader(h){
      return String(h ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    function normSize(s){
      return String(s ?? "")
        .toLowerCase()
        .replaceAll("×","x")
        .replace(/\s+/g," ")
        .replace(/\s*x\s*/g," x ")
        .replace(/\s*cm\s*/g," cm")
        .trim();
    }

    function parseDims(sizeStr){
      // attend un truc du style "100 x 81 cm" ou "100×81" ou "100 x 81"
      const s = normSize(sizeStr);
      const m = s.match(/(\d+(?:[.,]\d+)?)\s*x\s*(\d+(?:[.,]\d+)?)/i);
      if(!m) return null;
      const w = parseFloat(m[1].replace(",", "."));
      const h = parseFloat(m[2].replace(",", "."));
      if(!isFinite(w) || !isFinite(h)) return null;
      return { w, h };
    }

    function shapeFromSize(sizeStr){
      const d = parseDims(sizeStr);
      if(!d) return "unknown";
      if(Math.abs(d.w - d.h) < 0.0001) return "carre";
      return (d.w > d.h) ? "paysage" : "portrait";
    }

    function shapeLabel(key){
      if(key === "carre") return t("Carré");
      if(key === "paysage") return t("Paysage");
      if(key === "portrait") return t("Portrait");
      return t("Autre");
    }

    // CSV robuste (gère guillemets + virgules)
    function parseCSV(text){
      const rows = [];
      let row = [];
      let value = "";
      let inQuotes = false;

      for(let i=0;i<text.length;i++){
        const c = text[i];
        const next = text[i+1];

        if(c === '"' && next === '"'){
          value += '"';
          i++;
          continue;
        }
        if(c === '"'){
          inQuotes = !inQuotes;
          continue;
        }
        if(c === "," && !inQuotes){
          row.push(value.trim());
          value = "";
          continue;
        }
        if((c === "\n" || c === "\r") && !inQuotes){
          if(value.length || row.length){
            row.push(value.trim());
            rows.push(row);
            row = [];
            value = "";
          }
          continue;
        }
        value += c;
      }

      if(value.length || row.length){
        row.push(value.trim());
        rows.push(row);
      }

      return rows;
    }

    function cleanNA(v){
      const s = String(v ?? "").trim();
      if(!s) return "";
      if(s.toUpperCase() === "N/A") return "";
      return s;
    }

    function statusFromSheet(v){
      const s = String(v ?? "").trim().toUpperCase();
      return (s === "VENDUE") ? "vendue" : "disponible";
    }

    function cleanFile(jpg){
      return String(jpg || "").trim().replace(/^images\//i, "").replace(/^\/+/, "");
    }

    function buildImagePath(file, base = IMG_BASE){
      return encodeURI(`${base}/${file}`);
    }

    function statusLabel(s){
      return t(s === "vendue" ? "statut|Vendue" : "statut|Disponible");
    }

    // "Huile sur Toile · 60 x 120 cm" (sans les champs vides) — technique traduite en anglais
    function metaLine(a){
      return [a.technique && t(a.technique), a.size].filter(Boolean).map(escapeHtml).join(" · ");
    }

    /* =========================
       LOAD
       ========================= */

    async function fetchSheetCSV(){
      try{
        const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
        if(!res.ok) throw new Error("Impossible de charger la Google Sheet");
        const csv = await res.text();
        try{ localStorage.setItem(CACHE_KEY, csv); }catch(_){}
        return csv;
      }catch(err){
        // Google injoignable / Sheet dépubliée : on affiche la dernière version connue
        let cached = null;
        try{ cached = localStorage.getItem(CACHE_KEY); }catch(_){}
        if(cached){ console.warn("Sheet injoignable, utilisation de la copie locale.", err); return cached; }
        throw err;
      }
    }

    async function loadSizes(){
      try{
        const res = await fetch(SIZES_URL);
        return res.ok ? await res.json() : {};
      }catch(_){ return {}; }
    }

    async function loadArtworksFromSheet(){
      const [csv, sizes] = await Promise.all([fetchSheetCSV(), loadSizes()]);
      sizesMap = sizes || {};

      const rows = parseCSV(csv);
      if(!rows.length) throw new Error("Sheet vide");

      const header = rows.shift().map(normalizeHeader);
      const col = (name) => header.indexOf(normalizeHeader(name));

      // Sheet : Nom | Année | Catégorie | Technique | Format | Disponible | Jpg | Disponible où ? | Accueil
      return rows
        .filter(r => r[col("nom")])
        .map(r => {
          const title = cleanNA(r[col("nom")]);
          const category = cleanNA(r[col("categorie")]);
          const technique = cleanNA(r[col("technique")]);
          const formatRaw = cleanNA(r[col("format")]);
          const status = statusFromSheet(r[col("disponible")]);
          const where = cleanNA(r[col("disponible ou ?")]);
          const file = cleanFile(cleanNA(r[col("jpg")]));

          const size = formatRaw ? `${formatRaw} cm` : "";
          const sizeNorm = size ? normSize(size) : "";
          const shape = size ? shapeFromSize(sizeNorm) : "unknown";

          const image = file ? buildImagePath(file) : "";
          const thumb = file ? buildImagePath(file, THUMB_BASE) : "";

          return { title, category, technique, size, sizeNorm, shape, status, where, file, image, thumb };
        })
        .filter(a => a.title && a.image);
    }

    /* =========================
       CHIPS
       ========================= */

    function prettySize(sizeNorm){
      return sizeNorm.replace(/\s*x\s*/g," × ").replace(/\s*cm\s*/g," cm");
    }

    /* =========================
       FILTERING + RENDER
       ========================= */

    // ignore : filtres à ne pas appliquer (pour compter les œuvres de chaque choix d'un onglet)
    function matchArtwork(a, ignore = []){
      const on = (key) => filters[key].size && !ignore.includes(key);
      if(a.broken) return false; // image introuvable (ni miniature ni original)
      const q = (filters.q||"").trim().toLowerCase();
      if(q && !a.title.toLowerCase().includes(q)) return false;

      if(on("category") && !filters.category.has(a.category)) return false;
      if(on("technique") && !filters.technique.has(a.technique)) return false;

      // Format : forme + tailles (AND)
      if(on("shape") && !filters.shape.has(a.shape)) return false;
      if(on("size") && !filters.size.has(a.sizeNorm)) return false;

      if(on("status") && !filters.status.has(a.status)) return false;

      return true;
    }

    let renderQueued = false;
    function scheduleRender(){
      if(renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(() => { renderQueued = false; render(); });
    }

    /* =========================
       ONGLETS
       ========================= */

    // une ligne de choix : « Tous » + un bouton par valeur, avec le nombre d'œuvres (les choix vides sont masqués)
    // plusieurs choix possibles : un clic coche / décoche, « Toutes » efface la ligne
    function fillChoices(box, key, allLabel, items, onChange){
      const set = filters[key];
      box.innerHTML = "";
      items.forEach(it => {
        if(!it.n && it.value && !set.has(it.value)) return;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab tab--sub";
        btn.setAttribute("aria-pressed", String(it.value ? set.has(it.value) : set.size === 0));
        btn.innerHTML = `<span>${escapeHtml(it.value ? it.label : t(allLabel))}</span><span class="tab__count">${it.n}</span>`;
        btn.addEventListener("click", () => {
          if(!it.value) set.clear();
          else if(set.has(it.value)) set.delete(it.value);
          else set.add(it.value);
          onChange && onChange();
          render();
        });
        box.appendChild(btn);
      });
    }

    // choix en cours d'un onglet, affiché à côté de son nom (« Toutes » s'il n'y a pas de filtre)
    // onglet replié : le 1er choix + le nombre d'autres (« Danseuses +2 »)
    function groupValue(name){
      const g = GROUPS[name];
      const short = (list) => list[0] + (list.length > 1 ? ` +${list.length - 1}` : "");
      const vals = [...filters[g.key]].map(g.label);
      if(!vals.length) return t(g.all);
      if(name === "format" && filters.size.size) return `${short(vals)} · ${short([...filters.size].map(prettySize))}`;
      return short(vals);
    }

    function renderTabs(){
      els.groups.querySelectorAll(".tab").forEach(btn => {
        const name = btn.dataset.group;
        const on = filters[GROUPS[name].key].size > 0;
        btn.setAttribute("aria-expanded", String(name === activeGroup));
        btn.classList.toggle("has-filter", on);
        btn.querySelector(".tab__value").textContent = groupValue(name);
      });

      els.subtabs.hidden = !activeGroup;
      els.sizes.hidden = true;
      if(!activeGroup) return;

      const g = GROUPS[activeGroup];
      const pool = artworks.filter(a => matchArtwork(a, g.key === "shape" ? ["shape","size"] : [g.key]));
      const values = g.values || uniq(artworks.map(a => a[g.key]).filter(Boolean));
      fillChoices(els.subtabs, g.key, g.all, [{ value: "", n: pool.length }]
        .concat(values.map(v => ({ value: v, label: g.label(v), n: pool.filter(a => a[g.key] === v).length }))),
        g.key === "shape" ? () => filters.size.clear() : null);

      // Format : une fois une forme choisie, ses tailles en dessous
      const showSizes = activeGroup === "format" && filters.shape.size > 0;
      els.sizes.hidden = !showSizes;
      if(showSizes){
        const sizePool = artworks.filter(a => matchArtwork(a, ["size"]));
        const area = (v) => { const d = parseDims(v); return d ? d.w * d.h : 0; };
        const sizes = uniq(sizePool.map(a => a.sizeNorm).filter(Boolean)).sort((a, b) => area(a) - area(b));
        fillChoices(els.sizes, "size", "Toutes", [{ value: "", n: sizePool.length }]
          .concat(sizes.map(v => ({ value: v, label: prettySize(v), n: sizePool.filter(a => a.sizeNorm === v).length }))));
      }
    }

    function hasActiveFilters(){
      return Boolean(filters.q.trim() || filters.category.size || filters.technique.size ||
        filters.shape.size || filters.size.size || filters.status.size);
    }

    function render(){
      renderTabs();
      els.reset.hidden = !hasActiveFilters();

      const list = artworks.filter(a => matchArtwork(a));
      currentList = list;

      els.masonry.innerHTML = "";

      if(!list.length){
        els.masonry.innerHTML = `<p class="statusMsg">${t("Aucune œuvre ne correspond à ces filtres.")}</p>`;
      }

      list.forEach((a, idx)=>{
        const item = document.createElement("article");
        item.className = "piece";
        item.tabIndex = 0;
        item.setAttribute("role", "button");
        item.setAttribute("aria-label", `${a.title} — ${statusLabel(a.status)}. ${t("Ouvrir l'œuvre")}`);

        const dims = sizesMap[a.file];
        const dimAttrs = dims ? ` width="${dims[0]}" height="${dims[1]}"` : "";
        const meta = metaLine(a);

        item.innerHTML = `
          <div class="imgWrap">
            <img src="${a.thumb}" alt="${escapeHtml(a.title)}"${dimAttrs} loading="lazy" decoding="async">
          </div>
          <div class="cap">
            <p class="capTitle">${escapeHtml(a.title)}</p>
            ${meta ? `<p class="capMeta">${meta}</p>` : ""}
            <span class="badge ${a.status}">
              ${t(a.status === "vendue" ? "VENDUE" : "DISPONIBLE")}
            </span>
          </div>
        `;

        // miniature absente -> image d'origine ; si elle manque aussi -> l'œuvre est masquée
        const img = item.querySelector("img");
        let triedOriginal = false;
        img.addEventListener("error", () => {
          if(!triedOriginal){ triedOriginal = true; img.src = a.image; return; }
          console.warn("Image introuvable, œuvre masquée :", a.title, a.image);
          a.broken = true;
          scheduleRender();
        });

        item.addEventListener("click", ()=> openModal(idx));
        item.addEventListener("keydown", (e)=>{
          if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openModal(idx); }
        });
        els.masonry.appendChild(item);
      });

      els.count.textContent = `${list.length} ${t(list.length>1 ? "œuvres" : "œuvre")}`;
    }

    /* =========================
       MODAL
       ========================= */

    function showArtwork(idx){
      const n = currentList.length;
      if(!n) return;
      modalIndex = (idx + n) % n;
      const a = currentList[modalIndex];

      // miniature tout de suite, puis image d'origine dès qu'elle est chargée
      els.modalImg.src = a.thumb;
      els.modalImg.alt = a.title;
      const full = new Image();
      full.onload = () => { if(currentList[modalIndex] === a) els.modalImg.src = a.image; };
      full.src = a.image;

      els.modalTitle.textContent = a.title.toUpperCase();

      const label = t(a.status === "vendue" ? "VENDUE" : "DISPONIBLE");
      const parts = [];
      const meta = metaLine(a);
      if(meta) parts.push(meta);
      parts.push(`<span class="statusText ${a.status}">${label}</span>` +
                 (a.status === "disponible" && a.where ? ` · ${escapeHtml(t(a.where))}` : ""));
      els.modalMeta.innerHTML = parts.join(" · ");

      // œuvre disponible -> lien vers le formulaire, message pré-rempli
      els.modalCta.hidden = a.status !== "disponible";
      els.modalCta.href = "contact.html?oeuvre=" + encodeURIComponent(a.title);

      const multi = n > 1;
      els.modalPrev.hidden = !multi;
      els.modalNext.hidden = !multi;
    }

    function openModal(idx){
      showArtwork(idx);
      document.body.style.overflow = "hidden"; // pas de scroll de la page derrière
      els.modal.showModal();
    }

    function closeModal(){ if(els.modal.open) els.modal.close(); }

    /* =========================
       EVENTS
       ========================= */

    els.q.addEventListener("input", () => {
      filters.q = els.q.value || "";
      render();
    });

    els.reset.addEventListener("click", ()=>{
      filters.q = "";
      filters.category.clear();
      filters.technique.clear();
      filters.shape.clear();
      filters.size.clear();
      filters.status.clear();

      els.q.value = "";

      render();
    });

    els.groups.addEventListener("click", (e) => {
      const btn = e.target.closest(".tab");
      if(!btn) return;
      activeGroup = (activeGroup === btn.dataset.group) ? null : btn.dataset.group;
      renderTabs();
    });

    // clic en dehors de la barre ou Échap : on replie
    document.addEventListener("click", (e) => {
      // composedPath : le bouton cliqué a pu être retiré de la page entre-temps (choix redessinés)
      const inside = e.composedPath().some(n => n.classList && n.classList.contains("toolbar"));
      if(activeGroup && !inside){ activeGroup = null; renderTabs(); }
    });

    els.modalClose.addEventListener("click", closeModal);
    els.modalPrev.addEventListener("click", ()=> showArtwork(modalIndex - 1));
    els.modalNext.addEventListener("click", ()=> showArtwork(modalIndex + 1));
    // clic sur le fond ou sur la zone vide autour de l'image -> fermer
    els.modal.addEventListener("click", (e)=>{
      const t = e.target;
      if(t === els.modal || t.classList.contains("modal") || t.classList.contains("modal__media")) closeModal();
    });
    // "close" couvre aussi la touche Échap gérée nativement par <dialog>
    els.modal.addEventListener("close", ()=>{ document.body.style.overflow = ""; });

    document.addEventListener("keydown", (e)=>{
      if(els.modal.open){
        if(e.key === "ArrowLeft") showArtwork(modalIndex - 1);
        if(e.key === "ArrowRight") showArtwork(modalIndex + 1);
      }
      else if(e.key === "Escape" && activeGroup){
        const btn = els.groups.querySelector(`[data-group="${activeGroup}"]`);
        activeGroup = null;
        renderTabs();
        btn.focus();
      }
    });

    /* =========================
       INIT
       ========================= */

    document.addEventListener("DOMContentLoaded", async () => {
      try{
        artworks = await loadArtworksFromSheet();
        render();
      } catch(err){
        console.error(err);
        els.count.textContent = "";
        els.masonry.innerHTML =
          `<p class="statusMsg">${t("Impossible de charger les œuvres pour le moment. Vérifiez votre connexion, puis")} ` +
          `<a href="portfolio.html">${t("actualisez la page")}</a>.</p>`;
      }
    });
  </script>
</body>
</html>
